AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Voice-First Legal Rights Helper - MVP backend.
  The Bedrock Knowledge Base and its OpenSearch Serverless vector store are
  created manually via the Bedrock console (fastest path for a 4-day build)
  and passed in here as a parameter - see README "Day 1 setup".

Parameters:
  BedrockKnowledgeBaseId:
    Type: String
    Description: ID of the Bedrock Knowledge Base created in the console
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-5-sonnet-20240620-v1:0
    Description: Bedrock model id used for grounded answer generation
  BedrockFastModelId:
    Type: String
    Default: anthropic.claude-3-5-haiku-20241022-v1:0
    Description: Faster/cheaper model for lighter tasks (document Q&A follow-ups)

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        TABLE_NAME: !Ref SessionsTable
        BUCKET_NAME: !Ref AppBucket
        KB_ID: !Ref BedrockKnowledgeBaseId
        MODEL_ID: !Ref BedrockModelId
        FAST_MODEL_ID: !Ref BedrockFastModelId
        USE_MOCK_AI: "true"
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"

Resources:

  AppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "legal-helper-${AWS::AccountId}-${AWS::Region}"
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT, POST]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: legal-helper-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Cors:
        AllowMethods: "'GET,POST,PUT,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  CreateSessionFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/createSession.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        Api:
          Type: Api
          Properties: { Path: /session, Method: post, RestApiId: !Ref Api }

  QueryFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/query.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:Retrieve, bedrock:RetrieveAndGenerate]
              Resource: "*"
      Events:
        Api:
          Type: Api
          Properties: { Path: /query, Method: post, RestApiId: !Ref Api }

  VoiceQueryFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/voiceQuery.handler
      CodeUri: .
      Timeout: 90
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - S3CrudPolicy: { BucketName: !Ref AppBucket }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:Retrieve, bedrock:RetrieveAndGenerate]
              Resource: "*"
            - Effect: Allow
              Action: [transcribe:StartTranscriptionJob, transcribe:GetTranscriptionJob]
              Resource: "*"
      Events:
        Api:
          Type: Api
          Properties: { Path: /voice-query, Method: post, RestApiId: !Ref Api }

  UploadDocumentFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/uploadDocument.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - S3CrudPolicy: { BucketName: !Ref AppBucket }
      Events:
        Api:
          Type: Api
          Properties: { Path: /documents, Method: post, RestApiId: !Ref Api }

  ExplainDocumentFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/explainDocument.handler
      CodeUri: .
      Timeout: 90
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - S3CrudPolicy: { BucketName: !Ref AppBucket }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: "*"
            - Effect: Allow
              Action: [textract:AnalyzeDocument, textract:DetectDocumentText]
              Resource: "*"
      Events:
        Api:
          Type: Api
          Properties: { Path: /documents/{documentId}/explain, Method: post, RestApiId: !Ref Api }

  AskDocumentFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/askDocument.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: "*"
      Events:
        Api:
          Type: Api
          Properties: { Path: /documents/{documentId}/ask, Method: post, RestApiId: !Ref Api }

  GenerateLetterFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/generateLetter.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
        - S3CrudPolicy: { BucketName: !Ref AppBucket }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: "*"
      Events:
        Api:
          Type: Api
          Properties: { Path: /generate-letter, Method: post, RestApiId: !Ref Api }

  SpeakFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/speak.handler
      CodeUri: .
      Policies:
        - S3CrudPolicy: { BucketName: !Ref AppBucket }
        - Statement:
            - Effect: Allow
              Action: [polly:SynthesizeSpeech]
              Resource: "*"
      Events:
        Api:
          Type: Api
          Properties: { Path: /speak, Method: post, RestApiId: !Ref Api }

  # ─── Phase 3: Audio Upload ────────────────────────────────────────────────
  UploadAudioFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/uploadAudio.handler
      CodeUri: .
      Policies:
        - S3CrudPolicy: { BucketName: !Ref AppBucket }
      Events:
        Api:
          Type: Api
          Properties: { Path: /upload/audio, Method: post, RestApiId: !Ref Api }

  # ─── Phase 7: Legal Cases ─────────────────────────────────────────────────
  CasesFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/cases.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
      Events:
        CreateCase:
          Type: Api
          Properties: { Path: /cases, Method: post, RestApiId: !Ref Api }
        ListCases:
          Type: Api
          Properties: { Path: /cases, Method: get, RestApiId: !Ref Api }

  # ─── Phase 7: Reminders ───────────────────────────────────────────────────
  RemindersFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/reminders.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
      Events:
        CreateReminder:
          Type: Api
          Properties: { Path: /reminders, Method: post, RestApiId: !Ref Api }
        ListReminders:
          Type: Api
          Properties: { Path: /reminders, Method: get, RestApiId: !Ref Api }

  # ─── Phase 8: Session History Retrieval ───────────────────────────────────
  GetSessionFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/getSession.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SessionsTable }
      Events:
        Api:
          Type: Api
          Properties: { Path: /session/{sessionId}, Method: get, RestApiId: !Ref Api }

Outputs:
  ApiUrl:
    Description: Base URL for the API (append /session, /query, etc.)
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/dev"
  BucketName:
    Value: !Ref AppBucket
  TableName:
    Value: !Ref SessionsTable
  # New endpoints added in Phase 9
  UploadAudioEndpoint:
    Description: POST  /upload/audio  — get a presigned S3 PUT URL for audio recording
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/dev/upload/audio"
  CasesEndpoint:
    Description: GET/POST  /cases  — list or create tracked legal cases
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/dev/cases"
  RemindersEndpoint:
    Description: GET/POST  /reminders  — list or create deadline reminders
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/dev/reminders"
  GetSessionEndpoint:
    Description: GET  /session/{sessionId}  — retrieve full session history on app load/refresh
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/dev/session/{sessionId}"
